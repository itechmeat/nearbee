# Nearbee configuration example. Copy to nearbee.yaml (or nearbee.local.yaml,
# which git ignores) and pass it with --config. Secrets never go here: they
# come from the process environment or a .env file next to this file.
# Relative paths resolve against this file's directory; `~` is your home.

state_dir: .nearbee
apb:
  # Nearbee's own apb instance (scripts/apb-instance.sh), never the owner's
  # everyday dashboard. APB_URL in the environment overrides it.
  url: http://127.0.0.1:7322
  # The dedicated apb project that holds Nearbee's market playbooks.
  workspace_path: ~/.local/share/nearbee/apb-workspace
  # APB_CONFIG_DIR of that instance, for the apb CLI calls (abort, the
  # scope check, and the import and approval of `nearbee list`). Never
  # ~/.config/apb, the everyday instance.
  config_dir: ~/.local/share/nearbee/apb-config
  # XDG_CONFIG_HOME of that instance's unit (scripts/apb-instance.sh sets
  # it): a directory Nearbee owns with no OpenCode configuration in it. The
  # tier check makes the model routes unknown unless the unit carries
  # exactly this path.
  xdg_config_home: ~/.local/share/nearbee/xdg-config
limits:
  markdown_bytes: 262144
  file_bytes: 26214400
  files: 20
  total_bytes: 104857600
  # Stop taking new hires for the UTC day once the runs that ended without a
  # delivery cost this much (USD, decimal string).
  daily_loss_usd: "20"
retention:
  # Days after acceptance before `nearbee cleanup` deletes a hire's files.
  after_acceptance_days: 7

# Board bidding (off without this block). Per listing handle: what to search
# on the market's job board, the bid and how many bids may be open at once.
# The bidder runs inside `nearbee serve`; `nearbee bids` lists its journal.
# board:
#   interval_secs: 300              # a pass every 5 minutes (60 to 3600)
#   pass_budget_secs: 90            # one pass over every listing stops after this (15 to 300)
#   owner_verification: none        # your market badge: none, verified or identity_verified
#   listings:
#     astro-site:
#       query: "website astro"      # the board search text; omit to see every job
#       kinds: [standard]           # standard and or instant; competitions take entries, not bids
#       amount_usd: "2.00"          # default: the listing price
#       sla_seconds: 86400          # default: the listing SLA (600 to 2592000)
#       max_open_bids: 3
#       poster_allowlist:           # optional: bid only on jobs these market accounts post
#         - 00000000-0000-0000-0000-000000000000
