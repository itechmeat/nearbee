# cargo-deny configuration. Checked by `cargo deny check` in CI with a
# pinned cargo-deny version (see .github/workflows/ci.yml).

[advisories]
version = 2
# A security advisory or an unmaintained crate fails the check; the fix is
# a dependency update, not an ignore entry.
yanked = "deny"

[licenses]
version = 2
# The set of licenses the tree actually carries. A new dependency with a
# license outside this list must be added here on purpose, not silently.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Path-only workspace dependencies carry no version and count as wildcards;
# they are internal and not published, so a warning is enough.
wildcards = "warn"
# Nothing from these families is wanted in an offline adapter.
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
