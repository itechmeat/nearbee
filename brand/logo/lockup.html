<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@800&display=block" rel="stylesheet">
<style>
:root{--ground:#f2f1e9;--ink:#111}
:root[data-ground="dark"]{--ground:#101114;--ink:#f2f1e9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:600px;background:var(--ground)}
.lockup{height:100%;display:flex;align-items:center;justify-content:center;gap:56px}
.lockup img{height:420px}
.word{font:800 220px/1 "Mona Sans",sans-serif;letter-spacing:-.045em;color:var(--ink)}
</style></head><body>
<div class="lockup"><img src="nearbee-mark.png" alt=""><span class="word">nearbee</span></div>
<script>const g=new URLSearchParams(location.search).get('bg');if(g)document.documentElement.dataset.ground=g;</script>
</body></html>
