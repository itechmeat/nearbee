<!doctype html>
<html><head><meta charset="utf-8">

<style>
/* 1280 by 640; banner.png is taken at device scale 2, social-preview.png at 1 */
:root{--ground:#f2f1e9;--ink:#111;--ink2:#55575f;--ink3:#7a7c86;--green:#00ec97;--yellow:#fcbb00}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:var(--ground);position:relative;font-family:"Mona Sans",sans-serif;color:var(--ink)}
svg.d{position:absolute;inset:0}
svg.d text{font:500 14px "JetBrains Mono";fill:#3b3d46}
svg.d text.e{font-size:12px;fill:var(--ink3)}
svg.d text.h{font-size:12px;letter-spacing:.14em;fill:var(--ink3)}
.bee{position:absolute;left:870px;top:34px;width:180px}
.col{position:absolute;left:96px;top:150px;width:560px}
.lock{display:flex;align-items:center;gap:16px;height:104px}
.lock img{height:104px;width:104px;display:block;margin-left:-14px}
.word{font:800 96px/1 "Mona Sans";letter-spacing:-.045em}
.name{margin-top:24px;font:600 34px/1.1 "Mona Sans";letter-spacing:-.015em;white-space:nowrap}
.tag{margin-top:14px;font:500 19px/1.45 "Mona Sans";color:var(--ink2);width:500px}
.works{margin-top:34px}
.works .h{font:500 12px/1 "JetBrains Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.chips{display:flex;align-items:center;gap:24px;font:600 16px/1 "Mona Sans";color:var(--ink)}
.chips span{display:flex;align-items:center;gap:9px}
.chips svg{height:24px;width:24px;display:block}
