[workspace]
resolver = "3"
members = ["crates/nearbee-core", "crates/nearbee-apb", "crates/nearbee-market", "crates/nearbee-market-fixture", "crates/nearbee"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/itechmeat/nearbee"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
nearbee-core = { path = "crates/nearbee-core" }
nearbee-apb = { path = "crates/nearbee-apb" }
nearbee-market = { path = "crates/nearbee-market" }
nearbee-market-fixture = { path = "crates/nearbee-market-fixture" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaml_serde = "0.10.7"
dotenvy = "0.15.7"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
wiremock = "0.6.5"
h2 = "0.4.20"
tempfile = "3.27.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
url = "2.5.8"
